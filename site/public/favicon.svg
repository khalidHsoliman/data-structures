<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- three cells of an array, the first one filled -->
    <rect x="10" y="40" width="34" height="48" rx="4" class="fill" />
    <rect x="52" y="40" width="34" height="48" rx="4" class="stroke" fill="none" stroke-width="8" />
    <rect x="94" y="40" width="24" height="48" rx="4" class="stroke" fill="none" stroke-width="8" />
    <style>
        .fill { fill: #000; }
        .stroke { stroke: #000; }
        @media (prefers-color-scheme: dark) {
            .fill { fill: #FFF; }
            .stroke { stroke: #FFF; }
        }
    </style>
</svg>
